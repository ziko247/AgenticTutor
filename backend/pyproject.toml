[project]
name = "agentictutor-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "psycopg[binary,pool]", "httpx"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires the dedicated local Supabase database"]

[tool.ruff]
line-length = 100
